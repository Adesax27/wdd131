<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Load Demonstration</title>
    <meta name="description" content="A demonstration of lazy loading images using the loading attribute in HTML.">
    <meta name="author" content="ADEMOLA OKUNJOYO">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js"></script>
</head>
<body>
    <main>
        <h1>Lazy Loading Images</h1>
        <!-- Using placeholder images -->
        <img src="https://picsum.photos/id/10/400/600" alt="Landscape" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/20/400/600" alt="Landscape" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/30/400/600" alt="Landscape" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/40/400/600" alt="Landscape" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/50/400/600" alt="Landscape" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/60/400/600" alt="Landscape" width="400" height="600" loading="lazy">
    </main>
    <footer>
        <p>Ademola Samuel Okunjoyo | Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
