<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="A dynamic product review form matching the required course layout specifications.">
    <meta name="author" content="Ademola Samuel Okunjoyo">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="reviewForm">
            
            <div class="form-item">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-item rating-fieldset">
                <legend>Overall Rating</legend>
                <div class="stars-row">
                    <label class="star-item">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </label>
                    <label class="star-item">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </label>
                    <label class="star-item">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </label>
                    <label class="star-item">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </label>
                    <label class="star-item">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </label>
                </div>
            </fieldset>

            <div class="form-item">
                <label for="installationDate">Date of Installation</label>
                <input type="date" id="installationDate" name="installationDate" required>
            </div>

            <fieldset class="form-item checkbox-fieldset">
                <legend>Which features did you find useful in the product?<br><span class="instructions">(Check all that apply)</span></legend>
                
                <label class="check-label">
                    <input type="checkbox" id="feat-durability" name="features" value="durability"> 
                    Durability
                </label>
                <label class="check-label">
                    <input type="checkbox" id="feat-ease" name="features" value="ease-of-use"> 
                    Ease of Use
                </label>
                <label class="check-label">
                    <input type="checkbox" id="feat-performance" name="features" value="performance"> 
                    Performance
                </label>
                <label class="check-label">
                    <input type="checkbox" id="feat-design" name="features" value="design"> 
                    Design
                </label>
            </fieldset>

            <div class="form-item">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>

            <input type="submit" value="Post Review" class="submit-action-btn">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ademola Samuel Okunjoyo | AgricSense Form</p>
        <p>Nigeria</p>
        <p>Last Modification: 05/23/2026 16:40:42</p>
    </footer>

</body>
</html>
