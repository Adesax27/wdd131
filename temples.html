<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - Responsive Gallery</title>
    <meta name="description" content="A gallery of beautiful temples around the world.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans&display=swap" rel="stylesheet">
    
    <!-- CSS Links (Mobile first) -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    
    <!-- JavaScript -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menu" title="Toggle Menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Home</h2>
        <div class="grid-container">
            <!-- Repeat this figure 9 times -->
            <figure>
                <img src="images/provo.jpg" alt="salt lake temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Manti Temple" loading="lazy">
                <figcaption>Manti Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Logan Temple" loading="lazy">
                <figcaption>Logan Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="St. George Temple" loading="lazy">
                <figcaption>St. George Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Oakland Temple" loading="lazy">
                <figcaption>Oakland Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Washington D.C. Temple" loading="lazy">
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.jpg" alt="Tokyo Japan Temple" loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Ademola Samuel Okunjoyo | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
